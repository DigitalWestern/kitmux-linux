schema_version: 1
updated: 2026-08-02

license: GPL-3.0-only  # ADR 0006; Kitty is GPL-3.0 and the host links it

reproducibility:
  # ADR 0008. All evidence below was produced by one person, by hand, in two
  # Lima VMs on one Apple-silicon macOS machine.
  standalone_buildable: false      # R1: needs the private macOS repo at a tag
  automated_gate: none             # R2: due with the first Git remote
  desktop_gate_portable: true      # R3 closed: caller supplies DISPLAY; noVNC is optional
  locked_architectures: [aarch64, x86_64]  # R4 closed; locking is not support

release_runtime_evidence:
  architecture: aarch64
  approximate_size_mib: 104
