gtk_host_evidence:
  environment: ubuntu-26.04-aarch64-xfce-vnc
  toolkit: GTK 4.22.4
  display_backends: [x11, wayland]
  renderer: Mesa llvmpipe
  session: live libkitty shell with GLib PTY source
  verified: [render, tracked-gl-state-restore, resize, diagnostic, child-reap,
             key-press-release-repeat, key-encoding-live-terminal-state,
             focus-transfer, compose, dead-keys, altgr, non-us-layout, emoji,
             ibus-preedit-commit, native-wayland-client,
             webkit-coexistence-x11-wayland, fractional-scale-virtual-outputs,
             live-cross-output-scale-change, event-fairness,
             relocated-gui-loader, terminal-accessibility-role-focus]
  unproven: [clipboard, paste, selection, mouse, search,
             physical-gpu, packaging, cjk-conversion-engines,
             surrounding-text, physical-wayland-libinput, physical-mixed-dpi,
             simultaneous-unlike-scale-windows]
  wayland_evidence:
    compositor: Weston 14.0.2 nested with its X11 backend and no Xwayland
    client_backend: GdkWaylandDisplay
    exact_framebuffers: [1024x650, 760x450, 980x590]
    injection_boundary: XTEST targets only Weston; Weston emits wl_keyboard events
    limitation: display-bound compositor bridge, not physical libinput or evdev
  keyboard_evidence:
    translation: kitmux-linux/src/gtk_key_translation.c
    matrix: 32 events x 3 live terminal states, fixed expected bytes, no display
    windowed_runs: [default-terminal-state, kitty-keyboard-protocol-flags-15,
                    gtk-im-context-simple, ibus]
    injector: XTEST; xdotool infers modifiers from XKB shift levels and is unusable for function keys here
    repeat_source: X auto-repeat; per-event bytes fixed, repeat count bounded
    text_source: GtkIMMulticontext; the translation never synthesizes committed text
    commit_routes: [key-encoder for a first single-scalar commit with no composition,
                    direct-write for composition results and asynchronous commits]
    ibus_engines: ["xkb:us::eng", "m17n:t:latn-post"]
    session_state_touched: [x-auto-repeat, keyboard-layout, active-ibus-engine]
  webkit_evidence:
    version: 2.52.3
    display_backends: [x11, wayland]
    content: static in-memory fixture; no network, navigation, or product session
    exact_child_bytes_each_backend: "617a1b5b32347e"
    native_loader_closure: 139 resolved libraries; none missing
    loader_boundary: isolated libpython; distro WebKitGTK, JavaScriptCoreGTK, and GTK
    install_observation: 43 packages and 166 MB added to the development VM
    limitation: coexistence proof only; no browser product or package claim
  scaling_evidence:
    compositor: Sway 1.11 nested with three X11 outputs and pixman rendering
    protocols: [wp_fractional_scale_manager_v1, wp_viewporter]
    surface_scales: [1.0, 1.5, 2.0]
    gl_backing_factors: [1, 2, 2]
    logical_terminal_size: 480x270
    scale_framebuffers: [480x270, 960x540, 960x540]
    exact_cells: [14x27, 27x54, 27x54]
    live_sequence: 100%-150%-200%-100%; one child PID; original metrics restored
    limitation: virtual nested outputs and software rendering, not physical mixed-DPI or performance
  fairness_evidence:
    duration_seconds: 12
    pty_source_priority: 200  # G_PRIORITY_DEFAULT_IDLE; priority 0 starved every frame
    sessions: 5  # one visible and four hidden; all continuously readable
    repeated_resizes: 60
    heartbeats: 550
    rendered_frames: 715
    max_heartbeat_ms: 46.015
    max_frame_latency_ms: 24.779
    min_bytes_per_session: 107653266
    max_single_pump_ms: 2.149
    bounds_ms: {heartbeat: 250, frame: 500, single_pump: 500}
    limitation: fairness bounds under X11 and llvmpipe, not physical-GPU performance
  loader_evidence:
    layout: [bin/kitmux_gtk_host, lib/libkitty.so, lib/libpython3.14.so.1.0]
    host_runpath: "$ORIGIN/../lib"
    libkitty_runpath: "$ORIGIN"
    broad_ld_library_path: false
    toolkit_libraries: distro GTK and WebKitGTK
    live_result: X11 frame rendered and terminal child reaped from the installed layout
    limitation: temporary installed tree, not a native package or clean-machine install
  accessibility_evidence:
    terminal_role: terminal
    terminal_label: Terminal
    focus_transfer: terminal-entry-terminal
    text_input: GtkIMMulticontext with Compose and IBus paths proven by the desktop gate
    limitation: semantic role/focus viability only; Slice 5.3 added native roles, labels, and keyboard-only focus order, but full AT-SPI screen-reader and terminal-content coverage remains a Phase 9 accessibility-review obligation
  toolkit_decision: GTK 4 selected in Slice 2.3
  # Phase 2 reordered 2026-07-25: the checks that could disqualify GTK now run
  # first, as Slices 2.2C-2.2F. Selection, clipboard, paste, mouse, wheel, and
  # search moved to Phase 4 Slice 4.2 as product work.
  remaining_kill_tests: []
  moved_to_phase_4: [selection, clipboard, paste-safety, mouse, wheel, search]
  physical_gpu: deferred to Phase 6; llvmpipe proves correctness, not drivers

